{% extends "book/base.html" %}
{% block title %}Add Book — Book Vault{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">Add New Book</h1>
    <p class="page-sub">Fill in the details to add a book to your vault</p>
  </div>
</div>

<div class="form-wrap">
  <form action="{{ url_for('book.book_add') }}" method="POST" enctype="multipart/form-data">

    <div class="form-grid">

      <div class="field">
        <label for="title">Title <span style="color:#c03030">*</span></label>
        <div class="input-wrap">
          <i class="ti ti-book input-icon"></i>
          <input type="text" name="title" id="title" placeholder="Book title" required>
        </div>
      </div>

      <div class="field">
        <label for="author">Author <span style="color:#c03030">*</span></label>
        <div class="input-wrap">
          <i class="ti ti-user input-icon"></i>
          <input type="text" name="author" id="author" placeholder="Author name" required>
        </div>
      </div>

      <div class="field">
        <label for="language">Language <span style="color:#c03030">*</span></label>
        <div class="input-wrap">
          <i class="ti ti-language input-icon"></i>
          <input type="text" name="language" id="language" placeholder="e.g. English" required>
        </div>
      </div>

      <div class="field">
  <label for="genre">Genre</label>
  <div class="input-wrap">
    <select name="genre" id="genre" class="select-input">
      <option value="">— Select genre —</option>
      <option>Fantasy</option>
      <option>Fiction</option>
      <option>Programming</option>
      <option>Science Fiction</option>
      <option>Biography</option>
      <option>Self Help</option>
      <option>History</option>
      <option>Other</option>
    </select>
  </div>
</div>

      <div class="field">
        <label for="page_count">Total Pages <span style="color:#c03030">*</span></label>
        <div class="input-wrap">
          <i class="ti ti-files input-icon"></i>
          <input type="number" name="page_count" id="page_count"
                 placeholder="e.g. 320" min="1" required>
        </div>
      </div>

      <div class="field">
        <label for="published_year">Published Year <span class="optional">(optional)</span></label>
        <div class="input-wrap">
          <i class="ti ti-calendar input-icon"></i>
          <input type="number" name="published_year" id="published_year"
                 placeholder="e.g. 2021" min="1000" max="2099">
        </div>
      </div>

      <div class="field form-full">
  <label for="description">Description <span class="optional">(optional)</span></label>
  <textarea name="description" id="description"
            placeholder="A short description of the book…"
            rows="4" style="width:100%;resize:vertical;"></textarea>
</div>
      <div class="field form-full">
  <label class="form-label">Cover Image <span class="optional">(optional — PNG, JPG)</span></label>
  <div class="input-group">
    <input type="file" name="file" id="file"
           class="form-control"
           accept=".png,.jpg,.jpeg,image/png,image/jpeg">
  </div>
  <small class="text-muted">Max recommended size: 2MB</small>
</div>

<button type="submit" class="btn w-100 mt-3"
        style="background:#2d7a52;color:#fff;font-weight:600;padding:12px;border-radius:10px;font-size:15px;">
  <i class="ti ti-arrow-right"></i> Continue to Reading Details
</button>


  </form>
</div>
{% endblock %}
