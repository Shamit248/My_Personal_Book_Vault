{%extends "book/base.html" %}
{% block title%}Userbook Details{%endblock%}
{%block content%}
<h1>Add New Book</h1>

    <form action="{{ url_for('book.userbook_details',bid=book_detail.bid) }}" method="POST">

        <label>Status</label><br>
    <select name="status" required>
        <option value="">-- Select Status --</option>
        <option value="To Read">Wishlist</option>
        <option value="Reading">Reading</option>
        <option value="Completed">Completed</option>
    </select>

    <br><br>

    <label>Current Page</label><br>
    <input type="number" name="current_page" min="0" value="0">

    <br><br>

    <div class="field">
  <label for="cid">Collection <span class="optional">(optional)</span></label>
  <div class="input-wrap">
    <i class="ti ti-folder input-icon" aria-hidden="true"></i>
    <select name="cid" id="cid" class="select-input">
      <option value="">— No collection —</option>
      {% for col in collection %}
        <option value="{{ col.cid }}">{{ col.collection_name }}</option>
      {% endfor %}
    </select>
  </div>
</div>

    <br><br>

    <label>Rating</label><br>
    <select name="rating">
        <option value="0">No Rating</option>
        <option value="1">⭐ 1</option>
        <option value="2">⭐⭐ 2</option>
        <option value="3">⭐⭐⭐ 3</option>
        <option value="4">⭐⭐⭐⭐ 4</option>
        <option value="5">⭐⭐⭐⭐⭐ 5</option>
    </select>

    <br><br>

    <label>Personal Note</label><br>
    <textarea name="note" rows="5" cols="40"></textarea>

    <br><br>

    <button type="submit">Save Book</button>

    </form>
{%endblock%}
