{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<!-- <div class="?"> -->
    <h1>Register</h1>
    <form method="POST" action="{{url_for('auth.register')}}">
        <label for="email">Email</label>
        <input type="email" name="email" placeholder="Email" id="email" value="{{email}}" autocomplete="email" required>

        <label for="username">Username</label>
        <input type="text" name="username" placeholder="Username" id="username" value="{{username}}" autocomplete="username" required>
        
        <label for="password">Password</label>
        <input type="password" name="password" placeholder="Password" id="password" value="{{password}}" autocomplete="new-password" required>

        <input type="submit" value="Register">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}
        {% endwith %}
    </form>
<!-- </div> -->
{%endblock%}
